<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>admin page</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>

<body>
    <nav class="navbar">
        <div class="logo">Admin</div>

        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass icon"></i>
            <input type="text" placeholder="Search anything..." />
        </div>

        <div class="nav-links">
            <a href="#">Student</a>
            <a href="#">Mentor</a>
            <a href="#" class="logout">Logout</a>
        </div>
    </nav>

    <div class="main-container">
        <div class="left-side">
            <div id="student-container" class="card-container"></div>
        </div>
        <div>

            <div class="right-side">
                <div class="assign-section">
                    <h2>Assign Mentor to Student</h2>
                    <form id="assign-form">
                        <label for="student">Enter Student Name:</label>
                        <input type="text" id="student" placeholder="Type student name..." required>

                        <br><br>

                        <label for="mentor">Enter Mentor Name:</label>
                        <input type="text" id="mentor" placeholder="Type mentor name..." required>

                        <br><br>

                        <button type="submit">Assign Mentor</button>
                    </form>
                </div>


            </div>
            <table>
                <thead>
                    <tr>
                        <th>Module</th>
                        <th>Total Students</th>
                    </tr>
                </thead>
                <tbody id="module-table-body">
                </tbody>
            </table>

        </div>


    </div>





    <script src="admin.js"></script>
</body>

</html>
